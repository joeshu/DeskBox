# Re-run distribution audit after Actions was enabled.
# Trigger distribution audit on branch updates.\r\nname: Native AOT Distribution Gate

on:
  workflow_dispatch:
  push:
    branches:
      - codex/stage7b-arm64-actions

permissions:
  contents: read

concurrency:
  group: native-aot-distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribution:
    name: ${{ matrix.platform }} Direct Full and Store AOT distribution
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
            runner: windows-2025-vs2026
            expectedHost: X64
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      RestoreLockedMode: true
      DESKBOX_SKIP_LEGACY_CONTRACT_AUDIT: 1

    steps:
      - name: Checkout isolated source snapshot
        uses: actions/checkout@v4

      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.303

      - name: Verify native runner, Rust, Inno Setup, and Windows SDK
        shell: pwsh
        run: |
          $processArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture
          $osArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          $expected = [System.Runtime.InteropServices.Architecture]::${{ matrix.expectedHost }}
          if ($processArchitecture -ne $expected -or $osArchitecture -ne $expected) {
            throw "Expected native $expected OS/process; OS=$osArchitecture process=$processArchitecture."
          }

          dotnet --info
          rustc -vV
          cargo --version
          $rustcDetails = rustc -vV | Out-String
          if ($rustcDetails -notmatch 'rustc 1\.96\.0') {
            throw "The repository-pinned Rust 1.96.0 toolchain is not active."
          }          if ('${{ matrix.platform }}' -eq 'x64' -and
              $rustcDetails -notmatch 'host: x86_64-pc-windows-msvc') {
            throw "The x64 job is not using an x64 Rust host."
          }

          $iscc = @(
            (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source,
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } |
            Select-Object -First 1
          if (-not $iscc) {
            throw "The runner image does not expose ISCC.exe."
          }
          $innoVersion = (Get-Item -LiteralPath $iscc).VersionInfo.FileVersion
          Write-Host "Inno Setup compiler: $iscc ($innoVersion)"

          $kitsBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          if (-not (Get-ChildItem -LiteralPath $kitsBin -Filter makeappx.exe -Recurse -File |
              Select-Object -First 1)) {
            throw "The runner image does not expose MakeAppx.exe."
          }

      - name: Restore architecture-specific assets
        shell: pwsh
        run: >-
          dotnet restore .\DeskBox.sln
          --locked-mode
          -p:Platform=${{ matrix.platform }}
          -p:RuntimeIdentifier=${{ matrix.rid }}
          --verbosity minimal

      - name: Build and audit Direct Full installer and Store upload
        shell: pwsh
        run: >-
          .\scripts\build-stage-7c1-distribution.ps1
          -Platform ${{ matrix.platform }}
          -OutputDirectory .\.artifacts\stage7c1-${{ matrix.rid }}

      - name: Upload architecture distribution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7c1-${{ matrix.rid }}-distribution
          if-no-files-found: warn
          retention-days: 14
          path: |
            .artifacts/stage7c1-${{ matrix.rid }}/summary.json
            .artifacts/stage7c1-${{ matrix.rid }}/direct-aot-audit-summary.json
            .artifacts/stage7c1-${{ matrix.rid }}/direct-publish-files.txt
            .artifacts/stage7c1-${{ matrix.rid }}/inno-compile.log
            .artifacts/stage7c1-${{ matrix.rid }}/direct-installer/*.exe
            .artifacts/stage7c1-${{ matrix.rid }}/store/*.msixupload
            .artifacts/stage7c1-${{ matrix.rid }}/store/**/*DeskBox*.msix
            .artifacts/stage7c1-${{ matrix.rid }}/store/**/*DeskBox*.appxsym
            .artifacts/stage7c1-${{ matrix.rid }}/store-audit/summary.json
            .artifacts/stage7c1-${{ matrix.rid }}/store-audit/package-files.txt
            .artifacts/stage7c1-${{ matrix.rid }}/store-audit/AppxManifest.xml
